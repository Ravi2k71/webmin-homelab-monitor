name: Build Webmin Module

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare module directory
        run: |
          mkdir -p build/webmin-homelab-monitor
          cp module/index.cgi build/webmin-homelab-monitor/
          cp module/module.info build/webmin-homelab-monitor/
          cp module/config.pl.example build/webmin-homelab-monitor/
          chmod +x build/webmin-homelab-monitor/index.cgi

      - name: Build Webmin module package
        run: |
          cd build
          tar -czf webmin-homelab-monitor-1.0.wbm.gz webmin-homelab-monitor

      - name: Verify archive contents
        run: |
          tar -tzf build/webmin-homelab-monitor-1.0.wbm.gz

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: webmin-homelab-monitor-1.0
          path: build/webmin-homelab-monitor-1.0.wbm.gz
