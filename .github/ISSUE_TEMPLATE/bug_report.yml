name: Bug Report
description: Report a problem with Webmin Homelab Monitor
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with Webmin Homelab Monitor.

        Please include as much detail as possible so the issue can be reproduced.

  - type: input
    id: version
    attributes:
      label: Webmin Homelab Monitor version
      description: Which release are you using?
      placeholder: "Example: v1.0.1"
    validations:
      required: true

  - type: input
    id: webmin-version
    attributes:
      label: Webmin version
      placeholder: "Example: 2.x"
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Example: Ubuntu 24.04 LTS"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub release (.wbm.gz)
        - Manual installation from repository
        - Other
    validations:
      required: true

  - type: dropdown
    id: collector
    attributes:
      label: Affected area
      options:
        - Module installation
        - Dashboard
        - CPU
        - Memory
        - GPU
        - Storage
        - RAID
        - SMART
        - Docker
        - Tailscale
        - UFW
        - Backup monitoring
        - Network diagnostics
        - Weather
        - Module Config
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened?
      placeholder: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Enable...
        3. Click...
        4. Error appears...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      description: |
        Paste relevant error messages here.

        Remove passwords, tokens, private keys, public IP addresses,
        hostnames, or other sensitive information before posting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, configuration details, or anything else that may help.
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: I have removed passwords, tokens, private keys, and other sensitive information from this report.
          required: true
